name: DevSecOps - Security Audits

on:
  pull_request:
    branches: [ "main" ]
  schedule:
    # Corre automáticamente todos los lunes a las 07:00 UTC para detectar nuevos CVEs en main
    - cron: '0 7 * * 1'
  workflow_dispatch: # Permite dispararlo manualmente cuando quieras

concurrency:
  group: sec-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-secrets:
    name: "DevSecOps: Secret Scanning"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Escanear credenciales filtradas
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-sca:
    name: "DevSecOps: Dependency Audit (SCA)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

  security-sast:
    name: "DevSecOps: Static Analysis (SAST)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Análisis SAST ligero con Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/javascript
            p/typescript
            p/owasp-top-ten
            p/react
        env:
          SEMGREP_RULES: "p/security-code-review"
